<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WSSL</title>
    <link rel="stylesheet" type="text/css" href="index.css"/>
    <script type="module" src="index.js"></script>
    <script src="configuration.js"></script>
    <script src="console.js"></script>
  </head>
  <body onload="init();">
    <div class="page">
      <header>
        <h2>WSSL - WebSocket Server Library</h2>
        <p>Version: <span id="version"></span><br>by Goran "<a href="https://chupcko.org/" target="_blank">CHUPCKO</a>" Lazi&#x107;<br><a href="https://github.com/chupcko/wssl" target="_blank">https://github.com/chupcko/wssl</a></p>
        <p>Example echo, time and chat servers. Pick a combination to test it here.</p>
      </header>
      <p>
        <span class="group">Service:
        <label class="pick"><input type="radio" name="service" value="echo" checked onchange="choose();">Echo</label>
        <label class="pick"><input type="radio" name="service" value="time" onchange="choose();">Time</label>
        <label class="pick"><input type="radio" name="service" value="chat" onchange="choose();">Chat</label></span>
        <span class="group">Stack:
        <label class="pick"><input type="radio" name="family" value="ipv4" checked onchange="choose();">IPv4</label>
        <label class="pick"><input type="radio" name="family" value="ipv6" onchange="choose();">IPv6</label></span>
        <span class="group">Security:
        <label class="pick"><input type="radio" name="security" value="wss" checked onchange="choose();">wss</label>
        <label class="pick"><input type="radio" name="security" value="ws" onchange="choose();">ws</label></span>
      </p>
      <p id="choice"></p>
      <p><code id="server" class="mono"></code><span id="warn" class="warn" style="display: none;"> — Warning: ws is blocked from an https page and will not work. Open the http page instead: <a id="httplink" href=""></a></span></p>
      <div>
        <button class="button" onclick="clean();">Clean</button>
        <span class="group" id="nickbox"><input class="input" id="nickname" type="text" placeholder="Nickname" onkeydown="connectKey(event);">
        <button class="button" id="connect" onclick="connect();">Connect</button></span>
        <button class="button" id="connectPlain" onclick="connect();" style="display: none;">Connect</button>
        <span class="group" id="msgbox"><input class="input" id="message" type="text" placeholder="Message" onkeydown="sendKey(event);">
        <button class="button" id="send" onclick="send();">Send</button></span>
        <button class="button" id="disconnect" onclick="disconnect();">Disconnect</button>
      </div>
    </div>
    <div id="output" class="log"></div>
  </body>
</html>
